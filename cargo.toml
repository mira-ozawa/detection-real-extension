[package]
name = "extcheck"
version = "0.1.0"
edition = "2021"

[dependencies]

[profile.dev]
debug = "line-tables-only"

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true